k8sServiceHost: "auto"
k8sServicePort: "auto"
kubeProxyReplacement: "true"
bpf:
  masquerade: true
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: ["10.1.0.0/16"]
ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared
l2announcements:
  enabled: true
cluster:
  name: k8s-kind-oscar
  id: 1
# Parametros para trafficDistribution
loadBalancer:
  serviceTopology: true
routingMode: native
endpointSlice:
  enabled: true
ipv4NativeRoutingCIDR: "10.1.0.0/16"
autoDirectNodeRoutes: true
