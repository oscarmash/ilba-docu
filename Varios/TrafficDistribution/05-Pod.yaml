apiVersion: v1
kind: Pod
metadata:
  name: client-zone-a
  namespace: traffic-distribution
spec:
  nodeSelector:
    topology.kubernetes.io/zone: zone-a
  containers:
  - name: client
    image: curlimages/curl:latest
    command: ["/bin/sh", "-c", "sleep 3600"]
