---
- name: Install Helm
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  tasks:
    - name: Create helm temp dir
      ansible.builtin.file:
          path: /tmp/helm
          state: directory
      tags: install_helm

    - name: Download helm
      ansible.builtin.get_url:
              dest: /tmp/
              url: "https://get.helm.sh/helm-{{ helm_release }}-linux-amd64.tar.gz"
      tags: install_helm

    - name: Unarchive helm  
      ansible.builtin.unarchive:
              src: "/tmp/helm-{{ helm_release }}-linux-amd64.tar.gz"
              dest: /tmp/helm
              remote_src: yes
      tags: install_helm

    - name: Install helm  
      ansible.builtin.copy:
              src: /tmp/helm/linux-amd64/helm
              dest: /usr/local/bin/helm
              mode: 0755
              remote_src: yes
      become: true
      tags: install_helm

#Alias custom
- name: kubectl aliases
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  vars:
    bashrc: /root/.bashrc
  tasks:

    - name: Alias kubectl
      lineinfile:
        path: "{{ bashrc }}"
        line: alias k='kubectl'
        create: true
      tags: alias_custom

    - name: Alias kubectl delete
      lineinfile:
        path: "{{ bashrc }}"
        line: alias kcdf='kubectl delete -f'
        create: true
      tags: alias_custom

    - name: Alias kubectl apply
      lineinfile:
        path: "{{ bashrc }}"
        line: alias kcaf='kubectl apply -f'
        create: true
      tags: alias_custom

    - name: Alias kubectl delete pod grace-period force
      lineinfile:
        path: "{{ bashrc }}"
        line: alias kcdp='kubectl delete pod --grace-period=0 --force'
        create: true
      tags: alias_custom

#Dependency needed in order to apply yaml files
- name: Requirements
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  tasks:
    - name: Install openshift dependency
      ansible.builtin.package:
        name: python3-openshift
        state: present

#Cilium installation
- name: Cilium installation and configuration
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  tasks:
    - name: Install Cilium Chart
      kubernetes.core.helm:
        binary_path: /usr/local/bin/helm
        name: cilium
        namespace: kube-system
        chart_repo_url: https://helm.cilium.io/
        chart_ref: cilium
        chart_version: "{{ chart_version_cilium }}"
        values: "{{ lookup('template', '/kubespray/cluster-apps/' + cluster_name + '/charts-values/values-cilium.yaml') | from_yaml }}"
        release_state: present
        wait: true
        wait_timeout: 15m
      tags: cilium_installation

    - name: Esperar 4 minutos antes de continuar
      ansible.builtin.pause:
        seconds: 240

    - name: Apply config LB IPAM
      k8s:
        definition: "{{ lookup('file', '/kubespray/cluster-apps/' + cluster_name + '/configs/cilium/lb-ipam.yaml') | from_yaml_all }}"
        state: present
      tags: cilium_installation, cilium_config

    - name: Apply BGP
      k8s:
        definition: "{{ lookup('file', '/kubespray/cluster-apps/' + cluster_name + '/configs/cilium/bgp-cp.yaml') | from_yaml_all }}"
        state: present
      tags: cilium_installation, cilium_config

    - name: Non masquerade CIDRs
      k8s:
        definition: "{{ lookup('file', '/kubespray/cluster-apps/' + cluster_name + '/configs/cilium/nonMasqueradeCIDRs.yaml') | from_yaml_all }}"
        state: present
      tags: cilium_installation, cilium_config

    - name: Apply deploy a simple sample project
      k8s:
        definition: "{{ lookup('file', '/kubespray/cluster-apps/' + cluster_name + '/configs/test-ingress/app.yaml') | from_yaml_all }}"
        state: present
      tags: cilium_installation, cilium_config

    - name: Get latest version of Cilium CLI
      uri:
        url: https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
        return_content: yes
      register: cilium_version
      tags: cilium_installation, cilium_config

    - name: Download Cilium CLI
      unarchive:
        src: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_version.content | trim }}/cilium-linux-amd64.tar.gz"
        dest: "/usr/local/bin"
        remote_src: yes
        mode: '0755'
        owner: root
        group: root
      tags: cilium_installation, cilium_config

#Metrics Server installation
- name: Metrics server installation and configuration
  hosts: kube_control_plane
  gather_facts: false
  ignore_errors: true
  tasks:
    - name: Install Metrics server Chart
      kubernetes.core.helm:
        binary_path: /usr/local/bin/helm
        name: metrics-server
        namespace: kube-system
        chart_repo_url: https://kubernetes-sigs.github.io/metrics-server/
        chart_ref: metrics-server
        chart_version: "{{ chart_version_metrics_server }}"
        wait: true
        values: 
          args: 
            - --kubelet-insecure-tls
      tags: metrics-server_installation
