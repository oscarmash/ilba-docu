apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: internal-nodes-config
spec:
  ebgpMultihop: 1
  transport:
    tcpPort: 179
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-ibgp-mesh
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: "instance-64512"
      localASN: 64512
      peers:
        - name: "internal-mesh"
          nodeSelector:
            matchLabels:
              kubernetes.io/os: linux
          peerASN: 64512
          peerConfigRef:
            name: "internal-nodes-config"